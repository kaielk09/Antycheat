name: PurpleAnticheat build

on:
  push:
    paths:
      - 'PurpleAnticheat/**'
      - '.github/workflows/purpleanticheat-build.yml'
  pull_request:
    paths:
      - 'PurpleAnticheat/**'
      - '.github/workflows/purpleanticheat-build.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Build plugin
        run: mvn -B -f PurpleAnticheat/pom.xml clean package
      - name: Upload plugin JAR
        uses: actions/upload-artifact@v4
        with:
          name: PurpleAnticheat-1.3.5
          path: PurpleAnticheat/target/PurpleAnticheat-1.3.5.jar

settings:
  enabled: true
  alerts: true
  logging: true
  review-mode: true
  notify-admins: true

messages:
  prefix: '&5&lPURPLE &d&lANTICHEAT &8» &r'
  ban-title: '&5&lPURPLE ANTICHEAT'
  ban-subtitle: '&dYou have been banned from this server'
  ban-format: '&8&lPunishment details\\n&7Reason: &f{reason}\\n&7Duration: &f{duration}\\n&7Banned by: &f{staff}\\n\\n&dYou may appeal through the server staff.'
  ban-unknown-duration: '&cInvalid duration. Use 30m, 2h, 3d, 1w or perm.'

grim:
  enabled: true

checks:
  movement:
    enabled: true
    horizontal-per-tick: 1.45
    samples: 8
  combat:
    reach:
      enabled: true
      max-distance: 4.35

autopunish:
  enabled: true
  player-cooldown-seconds: 0
  checks:
    speed:
      enabled: true
      min-violations: 1
      window-seconds: 30
      duration: '1h'
    combat:
      enabled: true
      min-violations: 1
      window-seconds: 30
      duration: '1h'
    grim:
      enabled: true
      min-violations: 1
      window-seconds: 30
      duration: '1h'
    movement: {enabled: false, min-violations: 1, window-seconds: 30, duration: '1h'}
    flight: {enabled: false, min-violations: 1, window-seconds: 30, duration: '1h'}
    interaction: {enabled: false, min-violations: 1, window-seconds: 30, duration: '1h'}
    packet: {enabled: false, min-violations: 1, window-seconds: 30, duration: '1h'}
    inventory: {enabled: false, min-violations: 1, window-seconds: 30, duration: '1h'}
    knockback: {enabled: false, min-violations: 1, window-seconds: 30, duration: '1h'}
    aim: {enabled: false, min-violations: 1, window-seconds: 30, duration: '1h'}
    other: {enabled: false, min-violations: 1, window-seconds: 30, duration: '1h'}

guard:
  enabled: true
  commands: {limit: 10, window-seconds: 5}
  chat: {limit: 8, window-seconds: 5}
  interactions: {limit: 45, window-seconds: 5}
